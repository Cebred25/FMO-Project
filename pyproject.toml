[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmo-landscape"
version = "0.1.0"
description = "Governing-parameter and coherence analysis of the FMO excitonic transport landscape"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=16",        # parquet; my prototype fell back to CSV without it
  "scikit-learn>=1.5",
  "shap>=0.45",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
heom = ["qutip>=5.0"]   # Stage 4 only — keep it optional so the core installs anywhere
dev  = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
